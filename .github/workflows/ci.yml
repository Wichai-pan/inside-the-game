name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        # Test-only packages are listed here until they are added to requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1 "mcp>=2.2,<3" tenacity agent-framework-foundry agent-framework-openai azure-identity
      - name: Byte-compile
        run: python -m compileall -q insidegame tests
      - name: Run tests (no model calls)
        env:
          INSIDEGAME_PROVIDER: ollama
        run: python -m pytest
