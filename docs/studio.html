<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post-match Studio</title>
<style>
:root{--bg:#0a1418;--panel:#102026;--panel2:#152a31;--line:#294047;--text:#f2f5ec;--muted:#a3b9ba;--mint:#b5e899;--home:#f4c56e;--away:#63c8d0}
select{border:1px solid #3b5d5e;border-radius:8px;background:#193039;color:var(--text);padding:6px 9px;font:inherit}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0%,#173b3b,#0a1418 46%);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
main{max-width:1100px;margin:auto;padding:24px}a{color:var(--mint)}button{font:inherit;cursor:pointer}
.eyebrow{color:var(--mint);font-size:11px;font-weight:800;letter-spacing:.18em}h1{font-size:clamp(26px,4vw,42px);letter-spacing:-.03em;margin:8px 0 4px}.lead{color:var(--muted);margin:0 0 18px}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}.bar label{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;background:#183039;color:var(--muted);padding:7px 11px}.seg button.active{background:#2c5041;color:var(--mint)}
.score{display:flex;align-items:center;gap:14px;font-weight:800;font-size:20px;margin-left:auto}.score i{width:12px;height:12px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}.card.wide{grid-column:1/-1}
.card h2{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}.say{font-size:18px;font-weight:600;line-height:1.5;margin:0}.src{font-size:11px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:52px 1fr 120px 1fr 52px;gap:6px 8px;align-items:center;font-size:13px}.cmp .l{text-align:center;color:var(--muted);font-size:12px}.cmp .v{font-weight:700;font-variant-numeric:tabular-nums}.cmp .v.r{text-align:right}
.track{height:8px;background:#183039;border-radius:9px;overflow:hidden;display:flex}.track.left{justify-content:flex-end}.track div{height:100%;border-radius:9px}
.tl{position:relative;height:74px;margin:6px 8px}.tl .axis{position:absolute;left:0;right:0;top:36px;height:2px;background:#33525a}.tl .ht{position:absolute;top:28px;height:18px;width:1px;background:#4d6d74}.tl .tick{position:absolute;top:44px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.tl .g{position:absolute;top:22px;transform:translateX(-50%);text-align:center;font-size:11px;white-space:nowrap}.tl .g b{display:block;width:14px;height:14px;border-radius:50%;margin:8px auto 0;border:2px solid #0a1418}.tl .g span{position:absolute;top:-20px;left:50%;transform:translateX(-50%)}.tl .g.low span{top:34px}.tl{margin-bottom:22px}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end}.segs .c{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);text-align:center}.segs .stack{height:90px;display:flex;flex-direction:column;border-radius:6px;overflow:hidden}
.pl{display:grid;gap:6px}.pl div{display:grid;grid-template-columns:1fr auto;gap:8px;background:#183039;border-radius:8px;padding:8px 10px;font-size:13px}.pl small{color:var(--muted)}.pl b{font-variant-numeric:tabular-nums}
details{font-size:12px;color:#c8d7d4}details summary{cursor:pointer;color:var(--muted)}details ul{margin:6px 0 0;padding-left:18px}
.note{color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.cmp{grid-template-columns:40px 1fr 90px 1fr 40px}.score{margin-left:0}}
</style></head><body><main>
<div class="eyebrow">INSIDE THE GAME · POST-MATCH STUDIO</div><h1 id="title">Post-match studio</h1><p class="lead" id="lead"></p>
<section class="bar"><label data-i="match">Match</label><select id="match"></select><label data-i="viewer">Viewer</label><div class="seg" id="profile"><button data-v="casual" class="active" data-i="casual">Casual fan</button><button data-v="analyst" data-i="analyst">Analyst</button></div>
<label data-i="language">Language</label><div class="seg" id="lang"><button data-v="en" class="active">English</button><button data-v="zh">中文</button></div>
<div class="score" id="score"></div></section>
<div class="grid" id="cards"></div>
<p class="note" id="note"></p>
<p class="note"><a href="./index.html" data-i="back">← Back to live replay</a></p>
</main><script>
const I={en:{match:'Match',viewer:'Viewer',casual:'Casual fan',analyst:'Analyst',language:'Language',back:'← Back to live replay',facts:'Facts this was written from',agent:'Written by the studio agent',retry:n=>` after ${n-1} rewrite${n>2?'s':''}`,fallback:'Template fallback',lead:'Six talking points written by an agent from full-match tracking and event statistics. Every number is checked against the data.',note:p=>`${p.agent_texts} of ${p.texts} texts written by the agent (${p.retried} rewritten after a check), model ${p.model} via ${p.framework}.`,stats:{Goals:'Goals',xG:'xG',Shots:'Shots','Possession %':'Possession %',Crosses:'Crosses',PPDA:'PPDA','Progressive passes':'Progressive passes','Final-third entries':'Final-third entries','Non-penalty xG':'Non-penalty xG','Shots on target':'Shots on target'},pstat:{distance:'Most distance (km)',sprints:'Most sprints',shots:'Most shots',tackles:'Most tackles won',xt:'Most threat added (xT)'},tilt:'Field tilt by period',pen:'pen'},
zh:{match:'比赛',viewer:'观众',casual:'新观众',analyst:'数据分析',language:'语言',back:'← 返回实时回放',facts:'写作依据的数据',agent:'演播室智能体撰写',retry:n=>`，重写 ${n-1} 次`,fallback:'模板保底',lead:'智能体根据整场追踪与事件统计写出的六个看点，每个数字都与数据核对过。',note:p=>`共 ${p.texts} 段，智能体撰写 ${p.agent_texts} 段（${p.retried} 段被核查退回后重写），模型 ${p.model}，通过 ${p.framework} 运行。`,stats:{Goals:'进球',xG:'预期进球',Shots:'射门','Possession %':'控球率 %',Crosses:'传中',PPDA:'PPDA','Progressive passes':'推进传球','Final-third entries':'进入前场三分之一','Non-penalty xG':'非点球预期进球','Shots on target':'射正'},pstat:{distance:'跑动最多（公里）',sprints:'冲刺最多',shots:'射门最多',tackles:'抢断成功最多',xt:'传球威胁最多（xT）'},tilt:'各时段场地倾斜度',pen:'点球'}};
let S,profile='casual',lang='en',list=[];const team=i=>S.teams?S.teams[i]:{call:i?'Bayern':'Köln',color:i?'#e8434a':'#f2f2f2'};const $=s=>document.querySelector(s);const el=(t,c,txt)=>{const x=document.createElement(t);if(c)x.className=c;if(txt!=null)x.textContent=txt;return x};
const HOME='var(--home)',AWAY='var(--away)';
function compare(g){const L=I[lang],box=el('div','cmp');for(const[k,h,a]of g.rows){const max=Math.max(Math.abs(h),Math.abs(a),1e-9);const lt=el('div','track left'),rt=el('div','track');const lb=el('div');lb.style.cssText=`width:${100*Math.abs(h)/max}%;background:${HOME}`;lt.append(lb);const rb=el('div');rb.style.cssText=`width:${100*Math.abs(a)/max}%;background:${AWAY}`;rt.append(rb);box.append(el('div','v r',h),lt,el('div','l',L.stats[k]||k),rt,el('div','v',a))}return box}
function timeline(g){const L=I[lang],box=el('div','tl');const homeCall=team(0).call;box.append(el('div','axis'));const ht=el('div','ht');ht.style.left='50%';box.append(ht);const len=g.length||90,stepM=len>30?15:len>12?5:2;for(let m=0;m<=len;m+=stepM){const t=el('div','tick',m+"'");t.style.left=`${m/len*100}%`;box.append(t)}ht.style.display=len===90?'':'none';g.goals.forEach((x,gi)=>{const d=el('div','g'+(gi%2?' low':''));d.style.left=`${Math.min(100,x.minute/len*100)}%`;const lab=el('span',null,`${x.minute}' ${x.player.split(' ').slice(-1)[0]}${x.penalty?' ('+L.pen+')':''}`);const dot=el('b');dot.style.background=x.team===homeCall?HOME:AWAY;d.append(lab,dot);box.append(d)});return box}
function segments(g){const L=I[lang],wrap=el('div');wrap.append(el('div','src',L.tilt));const box=el('div','segs');for(const r of g.rows){const c=el('div','c'),st=el('div','stack');const a=el('div');a.style.cssText=`height:${r.away}%;background:${AWAY}`;const h=el('div');h.style.cssText=`height:${r.home}%;background:${HOME}`;st.append(a,h);c.append(el('span',null,`${r.away}%`),st,el('span',null,`${r.home}%`),el('span',null,r.minutes));box.append(c)}wrap.append(box);return wrap}
function players(g){const L=I[lang],box=el('div','pl');for(const r of g.rows){const d=el('div'),left=el('span');left.append(el('span',null,r.player+' '),el('small',null,`${r.team} · ${L.pstat[r.stat]}`));d.append(left,el('b',null,r.value));box.append(d)}return box}
function render(){const L=I[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';for(const n of document.querySelectorAll('[data-i]'))n.textContent=L[n.dataset.i];$('#lead').textContent=L.lead;$('#title').textContent=S.match;
 document.documentElement.style.setProperty('--home',team(0).color||'#f4c56e');document.documentElement.style.setProperty('--away',team(1).color||'#63c8d0');
 const v=S.sections[0].graphic.rows[0];$('#score').replaceChildren(Object.assign(el('i'),{style:`background:${HOME}`}),el('span',null,`${team(0).call} ${v[1]} – ${v[2]} ${team(1).call}`),Object.assign(el('i'),{style:`background:${AWAY}`}));
 const cards=$('#cards');cards.replaceChildren();for(const s of S.sections){const c=el('section','card'+(['tactics','numbers'].includes(s.id)?'':' wide'));const t=s.text[profile][lang];c.append(el('h2',null,s.title[lang]),el('p','say',t.text));
  const g=s.graphic;c.append(g.type==='compare'?compare(g):g.type==='timeline'?timeline(g):g.type==='segments'?segments(g):players(g));
  c.append(el('div','src',t.source.startsWith('agent')?L.agent+(t.attempts>1?L.retry(t.attempts):''):L.fallback));
  if(profile==='analyst'){const d=el('details'),sm=el('summary',null,L.facts),ul=el('ul');for(const f of s.facts[lang])ul.append(el('li',null,f));d.append(sm,ul);c.append(d)}cards.append(c)}
 $('#note').textContent=L.note(S.pipeline)}
function seg(id,fn){for(const b of $(id).children)b.onclick=()=>{$(id).querySelector('.active').classList.remove('active');b.classList.add('active');fn(b.dataset.v);render()}}
seg('#profile',v=>profile=v);seg('#lang',v=>lang=v);
async function open(id){const m=list.find(x=>x.id===id)||list[0];S=await(await fetch(m.url)).json();$('#match').value=m.id;history.replaceState(null,'',`?match=${m.id}`);render()}
$('#match').onchange=e=>open(e.target.value);
(async()=>{try{const si=await(await fetch('./synthetic/index.json')).json();list=(si.matches||[]).map(x=>({id:x.id,label:x.label,url:`./synthetic/${x.id}-studio.json`}))}catch(e){}
 try{const r=await fetch('./real/dfl-studio.json',{method:'HEAD'});if(r.ok)list.push({id:'dfl',label:'Köln–Bayern (real data, full match)',url:'./real/dfl-studio.json'})}catch(e){}
 $('#match').replaceChildren(...list.map(x=>Object.assign(document.createElement('option'),{value:x.id,textContent:x.label})));
 try{await open(new URLSearchParams(location.search).get('match'))}catch(e){$('#lead').textContent='Studio analysis not generated yet: run python -m insidegame.studio.'}})();
</script></body></html>
