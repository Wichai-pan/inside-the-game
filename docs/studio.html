<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside the Game · Post-match Studio</title>
<meta name="description" content="Six post-match talking points written by an agent from full-match tracking and event statistics, every number checked against the data.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/theme.css">
<style>
.hero{padding-top:28px;padding-bottom:20px}
.hero .ttl{font:800 clamp(34px,4.2vw,54px)/.95 var(--display);text-transform:uppercase;margin-top:12px}
.hero .lead{color:var(--muted);max-width:720px;margin-top:10px}
.board{margin-top:22px;display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.board .tm{display:flex;align-items:center;gap:16px;padding:22px 26px;min-width:0}
.board .tm.b{justify-content:flex-end;text-align:right}
.board .tm i{width:8px;align-self:stretch;border-radius:4px;flex:none}
.board .tm b{font:800 clamp(24px,3.4vw,44px)/1 var(--display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:break-word;min-width:0}
.board .tm small{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.board .sc{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5f7f9;color:#0a0f14;padding:10px 28px}
.board .sc b{font:800 clamp(40px,5vw,64px)/1 var(--display);letter-spacing:.02em}
.board .sc small{font:700 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:#56626e;margin-top:4px}
.controls{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:var(--s4)}
.controls .note{margin-left:auto;font-size:12px;color:var(--dim);max-width:420px;text-align:right}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sec.wide{grid-column:1/-1}
.sec.wide.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px 32px;align-items:start}
.sec.wide.split .gfx{grid-column:2;grid-row:1/span 3}
.sec-h{display:flex;align-items:baseline;gap:12px}
.sec-h .n{font:800 14px/1 var(--display);color:var(--accent);letter-spacing:.06em}
.sec-h h2{font:800 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.say{max-width:880px;font-size:19px;font-weight:500;line-height:1.55;margin:0;position:relative;padding-left:18px;border-left:3px solid var(--accent)}
.analyst .say{font-size:15.5px}
.src{font-size:11.5px;color:var(--dim);display:flex;gap:8px;align-items:center}
.src em{font-style:normal;font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-2);border-radius:99px;padding:2px 8px;color:var(--muted)}
.src em.ok{border-color:rgba(78,240,156,.35);color:var(--accent)}

.cmp{display:grid;grid-template-columns:52px 1fr minmax(90px,auto) 1fr 52px;gap:12px 10px;align-items:center;font-size:13px}
.cmp .l{text-align:center;color:var(--muted);font-size:12px;white-space:nowrap}
.cmp .v{font:600 15px/1 var(--mono)}.cmp .v.r{text-align:right}
.track{height:10px;background:var(--surface-3);border-radius:10px;overflow:hidden;display:flex}
.track.left{justify-content:flex-end}.track div{height:100%;border-radius:10px}

.tl{position:relative;height:130px;margin:0 10px}
.tl .axis{position:absolute;left:0;right:0;top:58px;height:3px;border-radius:3px;background:var(--surface-4)}
.tl .ht{position:absolute;top:48px;height:22px;width:2px;background:var(--line-2)}
.tl .tick{position:absolute;top:114px;font:500 10.5px/1 var(--mono);color:var(--dim);transform:translateX(-50%)}
.tl .g{position:absolute;top:0;height:110px;transform:translateX(-50%);font-size:12px;white-space:nowrap}
.tl .g b{position:absolute;top:51px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid var(--surface)}
.tl .g span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.tl .g span small{font-family:var(--mono);color:var(--dim);margin-right:4px}
.tl .g.low span{top:74px}
.tl .g.edge-l span{left:0;transform:none}.tl .g.edge-r span{left:auto;right:0;transform:none}

.segs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;align-items:end}
.segs .c{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);text-align:center}
.segs .stack{height:120px;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;gap:2px}
.segs .c .m{font-family:var(--mono);color:var(--dim)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}

.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.pl .r{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:14px 16px;border-top:3px solid var(--line-2)}
.pl .r b{grid-row:1/span 2;font:800 32px/1 var(--display);font-variant-numeric:tabular-nums}
.pl .r .nm{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.pl .r small{color:var(--dim);font-size:11.5px}

details{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
details summary{cursor:pointer;color:var(--muted);font-weight:600}
details ul{margin:8px 0 0;padding-left:18px;line-height:1.6}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:var(--s5);font-size:12.5px;color:var(--dim)}
.err{padding:24px;color:var(--muted)}

@media(max-width:900px){
  .sec.wide.split{display:flex}
}
@media(max-width:760px){
  .grid{grid-template-columns:1fr}
  .controls .note{margin-left:0;text-align:left}
}
@media(max-width:600px){
  .board .tm{padding:16px 10px;gap:8px}.board .tm b{font-size:21px;overflow-wrap:normal}.board .tm small{display:none}.board .sc{padding:10px 14px}
  .controls{display:grid;grid-template-columns:1fr 1fr;padding:14px 16px}
  .controls .full{grid-column:1/-1}.controls .select{width:100%}.controls .seg{display:flex}.controls .seg button{flex:1}
  .controls .note{grid-column:1/-1}
  .sec{padding:18px 16px}
  .say{font-size:17px}
  .cmp{grid-template-columns:38px 1fr auto 1fr 38px;gap:10px 6px}.cmp .l{font-size:11px;white-space:normal}
  .tl{margin:0 4px}
}
</style></head>
<body class="casual">
<header class="nav"><div class="wrap">
  <a class="brand" href="./index.html"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#4ef09c"/><path d="M8 22V10M8 10h7M24 10v12M17 10h7M16 22h8" stroke="#04140b" stroke-width="3" stroke-linecap="round" fill="none"/></svg><span>Inside the Game</span></a>
  <nav><a href="./index.html" id="back" data-i="navlive">Match centre</a><a href="./studio.html" aria-current="page" data-i="navstudio">Studio</a><a href="./about.html" data-i="navabout">How it works</a></nav>
  <div class="right"><a class="btn" href="https://github.com/Wichai-pan/inside-the-game">GitHub ↗</a></div>
</div></header>

<div class="wrap">
<section class="hero">
  <div class="eyebrow" data-i="eyebrow">Post-match studio · agent-written analysis</div>
  <h1 class="ttl" data-i="title">Post-match studio</h1>
  <p class="lead" id="lead"></p>
  <div class="board" id="board" aria-live="polite"></div>
</section>

<section class="controls" aria-label="Viewer settings">
  <div class="full"><label class="field-label" for="match" data-i="match">Match</label><select id="match" class="select"></select></div>
  <div><span class="field-label" data-i="viewer">Viewer</span><div class="seg" id="profile"><button data-v="casual" class="active" data-i="casual">Casual fan</button><button data-v="analyst" data-i="analyst">Analyst</button></div></div>
  <div><span class="field-label" data-i="language">Language</span><div class="seg" id="lang"><button data-v="en" class="active">English</button><button data-v="zh">中文</button></div></div>
  <p class="note" id="note"></p>
</section>

<div class="grid" id="cards"></div>
<div class="foot"><a href="./index.html" id="back2" data-i="back">← Back to live replay</a><span id="srcline"></span></div>
</div>
<footer class="site"><div class="wrap"><span data-i="foot">Teams and players are fictional. Every number on this page comes from the match data.</span><span><a href="./about.html" data-i="navabout">How it works</a> · <a href="https://github.com/Wichai-pan/inside-the-game" data-i="code">Source code</a></span></div></footer>

<script>
const I={en:{navlive:'Match centre',title:'Post-match studio',navstudio:'Studio',navabout:'How it works',eyebrow:'Post-match studio · agent-written analysis',code:'Source code',foot:'Teams and players are fictional. Every number on this page comes from the match data.',final:'Full time',match:'Match',viewer:'Viewer',casual:'Casual fan',analyst:'Analyst',language:'Language',back:'← Back to live replay',facts:'Facts this was written from',agent:'Written by the studio agent',retry:n=>` after ${n-1} rewrite${n>2?'s':''}`,fallback:'Template fallback',lead:'Six talking points written by an agent from full-match tracking and event statistics. Every number is checked against the data.',note:p=>`${p.agent_texts} of ${p.texts} texts written by the agent (${p.retried} rewritten after a check), model ${p.model} via ${p.framework}.`,stats:{Goals:'Goals',xG:'xG',Shots:'Shots','Possession %':'Possession %',Crosses:'Crosses',PPDA:'PPDA','Progressive passes':'Progressive passes','Final-third entries':'Final-third entries','Non-penalty xG':'Non-penalty xG','Shots on target':'Shots on target'},pstat:{distance:'Most distance (km)',sprints:'Most sprints',shots:'Most shots',tackles:'Most tackles won',xt:'Most threat added (xT)'},tilt:'Field tilt by period: share of final-third touches',pen:'pen'},
zh:{navlive:'比赛中心',title:'赛后演播室',navstudio:'演播室',navabout:'工作原理',eyebrow:'赛后演播室 · 智能体撰写的分析',code:'源代码',foot:'球队和球员均为虚构。本页每个数字都来自比赛数据。',final:'全场结束',match:'比赛',viewer:'观众',casual:'新观众',analyst:'数据分析',language:'语言',back:'← 返回实时回放',facts:'写作依据的数据',agent:'演播室智能体撰写',retry:n=>`，重写 ${n-1} 次`,fallback:'模板保底',lead:'智能体根据整场追踪与事件统计写出的六个看点，每个数字都与数据核对过。',note:p=>`共 ${p.texts} 段，智能体撰写 ${p.agent_texts} 段（${p.retried} 段被核查退回后重写），模型 ${p.model}，通过 ${p.framework} 运行。`,stats:{Goals:'进球',xG:'预期进球',Shots:'射门','Possession %':'控球率 %',Crosses:'传中',PPDA:'PPDA','Progressive passes':'推进传球','Final-third entries':'进入前场三分之一','Non-penalty xG':'非点球预期进球','Shots on target':'射正'},pstat:{distance:'跑动最多（公里）',sprints:'冲刺最多',shots:'射门最多',tackles:'抢断成功最多',xt:'传球威胁最多（xT）'},tilt:'各时段场地倾斜度：前场三分之一触球占比',pen:'点球'}};
let S,profile='casual',lang='en',list=[];const team=i=>S.teams?S.teams[i]:{name:i?'FC Bayern München':'1. FC Köln',call:i?'Bayern':'Köln',color:i?'#e8434a':'#f2f2f2'};const $=s=>document.querySelector(s);const el=(t,c,txt)=>{const x=document.createElement(t);if(c)x.className=c;if(txt!=null)x.textContent=txt;return x};
const HOME='var(--home)',AWAY='var(--away)';
const colorOf=call=>call===team(0).call||call===team(0).name?HOME:AWAY;
function compare(g){const L=I[lang],box=el('div','cmp');for(const[k,h,a]of g.rows){const max=Math.max(Math.abs(h),Math.abs(a),1e-9);const lt=el('div','track left'),rt=el('div','track');const lb=el('div');lb.style.cssText=`width:${100*Math.abs(h)/max}%;background:${HOME}`;lt.append(lb);const rb=el('div');rb.style.cssText=`width:${100*Math.abs(a)/max}%;background:${AWAY}`;rt.append(rb);box.append(el('div','v r',h),lt,el('div','l',L.stats[k]||k),rt,el('div','v',a))}return box}
function timeline(g){const L=I[lang],box=el('div','tl');box.append(el('div','axis'));const ht=el('div','ht');ht.style.left='50%';box.append(ht);const len=g.length||90,stepM=len>30?15:len>12?5:2;for(let m=0;m<=len;m+=stepM){const t=el('div','tick',m+"'");t.style.left=`${m/len*100}%`;box.append(t)}ht.style.display=len===90?'':'none';
 g.goals.forEach((x,gi)=>{const pos=Math.min(100,x.minute/len*100);const d=el('div','g'+(gi%2?' low':'')+(pos<12?' edge-l':pos>88?' edge-r':''));d.style.left=`${pos}%`;const lab=el('span');lab.append(el('small',null,`${x.minute}'`),document.createTextNode(`${x.player.split(' ').slice(-1)[0]}${x.penalty?' ('+L.pen+')':''}`));const dot=el('b');dot.style.background=colorOf(x.team);d.append(lab,dot);box.append(d)});return box}
function legend(){const lg=el('div','legend');for(const[i,c]of[[0,HOME],[1,AWAY]]){const s=el('span'),k=el('i');k.style.background=c;s.append(k,document.createTextNode(team(i).name||team(i).call));lg.append(s)}return lg}
function segments(g){const L=I[lang],wrap=el('div');wrap.style.cssText='display:grid;gap:12px';wrap.append(el('div','src',L.tilt));const box=el('div','segs');for(const r of g.rows){const c=el('div','c'),st=el('div','stack');const a=el('div');a.style.cssText=`height:${r.away}%;background:${AWAY}`;const h=el('div');h.style.cssText=`height:${r.home}%;background:${HOME}`;st.append(a,h);c.append(el('span',null,`${r.away}%`),st,el('span',null,`${r.home}%`),el('span','m',r.minutes));box.append(c)}wrap.append(box,legend());return wrap}
function players(g){const L=I[lang],box=el('div','pl');for(const r of g.rows){const d=el('div','r');d.style.borderTopColor=colorOf(r.team);d.append(el('b',null,r.value),el('span','nm',r.player),el('small',null,`${r.team} · ${L.pstat[r.stat]||r.stat}`));box.append(d)}return box}
function board(){const v=S.sections[0].graphic.rows[0],L=I[lang],b=$('#board');b.replaceChildren();const side=(i,cls)=>{const d=el('div','tm '+cls),k=el('i');k.style.background=i?AWAY:HOME;const tx=el('div');tx.append(el('b',null,team(i).name||team(i).call));if(i){d.append(tx,k)}else{d.append(k,tx)}return d};const sc=el('div','sc');sc.append(el('b',null,`${v[1]}–${v[2]}`),el('small',null,L.final));b.append(side(0,'a'),sc,side(1,'b'))}
const WIDE=new Set(['verdict','turning_point','momentum','player']),SPLIT=new Set(['verdict','momentum']);
function render(){const L=I[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';for(const n of document.querySelectorAll('[data-i]'))n.textContent=L[n.dataset.i];$('#lead').textContent=L.lead;
 document.documentElement.style.setProperty('--home',team(0).color||'#f4c56e');document.documentElement.style.setProperty('--away',team(1).color||'#63c8d0');board();
 const cards=$('#cards');cards.replaceChildren();S.sections.forEach((s,i)=>{const cls=['sec'];if(WIDE.has(s.id))cls.push('wide');if(SPLIT.has(s.id))cls.push('split');const c=el('section',cls.join(' '));const t=s.text[profile][lang];
  const hd=el('div','sec-h');hd.append(el('span','n',String(i+1).padStart(2,'0')),el('h2',null,s.title[lang]));
  const g=s.graphic,gfx=el('div','gfx');gfx.append(g.type==='compare'?compare(g):g.type==='timeline'?timeline(g):g.type==='segments'?segments(g):players(g));
  const src=el('div','src'),agent=t.source.startsWith('agent');src.append(el('em',agent?'ok':'',agent?'✓ '+L.agent:L.fallback));if(agent&&t.attempts>1)src.append(document.createTextNode(L.retry(t.attempts).replace(/^[,，]\s*/,'')));
  c.append(hd,el('p','say',t.text),gfx,src);
  if(profile==='analyst'){const d=el('details'),sm=el('summary',null,L.facts),ul=el('ul');for(const f of s.facts[lang])ul.append(el('li',null,f));d.append(sm,ul);c.append(d)}cards.append(c)});
 $('#note').textContent=L.note(S.pipeline);$('#srcline').textContent=S.source||''}
function seg(id,fn){for(const b of $(id).children)b.onclick=()=>{$(id).querySelector('.active').classList.remove('active');b.classList.add('active');fn(b.dataset.v);render()}}
seg('#profile',v=>{profile=v;document.body.className=v});seg('#lang',v=>lang=v);
async function open(id){const m=list.find(x=>x.id===id)||list[0];S=await(await fetch(m.url)).json();$('#match').value=m.id;history.replaceState(null,'',`?match=${m.id}`);render()}
$('#match').onchange=e=>open(e.target.value);
(async()=>{try{const si=await(await fetch('./synthetic/index.json')).json();list=(si.matches||[]).map(x=>({id:x.id,label:x.label,url:`./synthetic/${x.id}-studio.json`}))}catch(e){}
 try{const r=await fetch('./real/dfl-studio.json',{method:'HEAD'});if(r.ok)list.push({id:'dfl',label:'Köln–Bayern (real data, full match)',url:'./real/dfl-studio.json'})}catch(e){}
 $('#match').replaceChildren(...list.map(x=>Object.assign(document.createElement('option'),{value:x.id,textContent:x.label})));
 try{await open(new URLSearchParams(location.search).get('match'))}catch(e){$('#lead').textContent='Studio analysis not generated yet: run python -m insidegame.studio.';console.error(e)}})();
</script></body></html>
